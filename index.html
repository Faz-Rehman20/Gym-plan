<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Gym Plan</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0d0d;
    --surface: #161616;
    --surface2: #1e1e1e;
    --border: #2a2a2a;
    --text: #f0f0f0;
    --muted: #888;
    --purple: #a78bfa;
    --teal: #2dd4bf;
    --coral: #fb923c;
    --blue: #60a5fa;
    --green: #4ade80;
    --yt: #ff4444;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; min-height: 100vh; padding-bottom: 4rem; }

  header { padding: 1.5rem 1rem 1rem; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 10; background: var(--bg); }
  header h1 { font-family: 'DM Mono', monospace; font-size: 1rem; font-weight: 500; letter-spacing: 0.08em; color: var(--muted); text-transform: uppercase; }
  header p { font-size: 0.75rem; color: #555; margin-top: 2px; font-family: 'DM Mono', monospace; }

  .day-nav { display: flex; overflow-x: auto; gap: 6px; padding: 0.75rem 1rem; border-bottom: 1px solid var(--border); scrollbar-width: none; background: var(--bg); position: sticky; top: 69px; z-index: 10; }
  .day-nav::-webkit-scrollbar { display: none; }
  .day-btn { flex-shrink: 0; padding: 6px 14px; border-radius: 999px; border: 1px solid var(--border); background: none; color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.75rem; cursor: pointer; transition: all 0.15s; position: relative; }
  .day-btn.active { background: var(--text); color: var(--bg); border-color: var(--text); font-weight: 500; }
  .day-btn .done-dot { position: absolute; top: 2px; right: 2px; width: 6px; height: 6px; background: var(--teal); border-radius: 50%; }

  .content { padding: 1rem; }
  .day-meta { margin-bottom: 1.25rem; }
  .day-title { font-size: 1.4rem; font-weight: 700; line-height: 1.2; }
  .day-focus { font-size: 0.8rem; font-family: 'DM Mono', monospace; color: var(--muted); margin-top: 4px; letter-spacing: 0.04em; }

  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 0.7rem; font-family: 'DM Mono', monospace; font-weight: 500; letter-spacing: 0.06em; margin-bottom: 0.6rem; }
  .badge-strength { background: rgba(167,139,250,0.15); color: var(--purple); border: 1px solid rgba(167,139,250,0.3); }
  .badge-cardio { background: rgba(45,212,191,0.12); color: var(--teal); border: 1px solid rgba(45,212,191,0.3); }
  .badge-rest { background: rgba(136,136,136,0.12); color: var(--muted); border: 1px solid rgba(136,136,136,0.3); }
  .badge-full { background: rgba(251,146,60,0.12); color: var(--coral); border: 1px solid rgba(251,146,60,0.3); }

  .exercise-list { display: flex; flex-direction: column; gap: 10px; }

  .exercise-card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: border-color 0.2s; }
  .exercise-card.completed { border-color: var(--teal); }

  .ex-header { padding: 0.875rem 1rem; display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; }
  .ex-left { display: flex; flex-direction: column; gap: 5px; flex: 1; min-width: 0; }
  .ex-name-row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .ex-name { font-size: 0.95rem; font-weight: 500; line-height: 1.3; }
  .yt-link { display: inline-flex; align-items: center; gap: 3px; font-size: 0.65rem; font-family: 'DM Mono', monospace; color: var(--yt); background: rgba(255,68,68,0.1); border: 1px solid rgba(255,68,68,0.25); border-radius: 5px; padding: 2px 7px; text-decoration: none; white-space: nowrap; flex-shrink: 0; }
  .ex-weight { font-family: 'DM Mono', monospace; font-size: 0.75rem; color: var(--blue); background: rgba(96,165,250,0.1); border: 1px solid rgba(96,165,250,0.2); padding: 3px 8px; border-radius: 6px; white-space: nowrap; flex-shrink: 0; align-self: flex-start; }
  .ex-pills { display: flex; gap: 6px; flex-wrap: wrap; }
  .pill { font-family: 'DM Mono', monospace; font-size: 0.7rem; color: var(--muted); background: var(--surface2); border-radius: 6px; padding: 2px 8px; border: 1px solid var(--border); }
  .ex-note { font-size: 0.75rem; color: #666; margin-top: 6px; line-height: 1.4; font-style: italic; }

  /* Progression reminder badge */
  .prog-reminder { display: inline-flex; align-items: center; gap: 4px; font-size: 0.65rem; font-family: 'DM Mono', monospace; color: var(--coral); background: rgba(251,146,60,0.1); border: 1px solid rgba(251,146,60,0.3); border-radius: 5px; padding: 2px 7px; margin-top: 4px; }

  /* Log section */
  .log-toggle { width: 100%; padding: 8px 1rem; background: var(--surface2); border: none; border-top: 1px solid var(--border); color: var(--muted); font-family: 'DM Mono', monospace; font-size: 0.72rem; text-align: left; cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
  .log-toggle.open { color: var(--teal); }
  .log-panel { display: none; padding: 0.875rem 1rem; border-top: 1px solid var(--border); background: var(--surface2); }
  .log-panel.open { display: block; }

  .log-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 10px; }
  .log-input-wrap { display: flex; flex-direction: column; gap: 4px; }
  .log-label { font-size: 0.65rem; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
  .log-input { background: var(--surface); border: 1px solid var(--border); border-radius: 8px; padding: 7px 10px; color: var(--text); font-family: 'DM Mono', monospace; font-size: 0.85rem; width: 100%; outline: none; }
  .log-input:focus { border-color: var(--teal); }

  .difficulty-row { display: flex; gap: 6px; margin-bottom: 10px; }
  .diff-btn { flex: 1; padding: 7px 4px; border-radius: 8px; border: 1px solid var(--border); background: none; font-family: 'DM Mono', monospace; font-size: 0.72rem; cursor: pointer; transition: all 0.15s; color: var(--muted); }
  .diff-btn.easy.selected { background: rgba(74,222,128,0.15); border-color: var(--green); color: var(--green); }
  .diff-btn.medium.selected { background: rgba(251,146,60,0.15); border-color: var(--coral); color: var(--coral); }
  .diff-btn.hard.selected { background: rgba(255,68,68,0.15); border-color: var(--yt); color: var(--yt); }

  .log-save-btn { width: 100%; padding: 8px; background: var(--teal); color: #000; border: none; border-radius: 8px; font-family: 'DM Mono', monospace; font-size: 0.8rem; font-weight: 500; cursor: pointer; }
  .log-save-btn:active { opacity: 0.8; }

  .prev-log { margin-top: 10px; padding: 8px 10px; background: var(--surface); border-radius: 8px; border: 1px solid var(--border); }
  .prev-log-title { font-size: 0.65rem; font-family: 'DM Mono', monospace; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; margin-bottom: 4px; }
  .prev-log-entry { font-size: 0.78rem; color: #aaa; line-height: 1.6; }
  .prev-log-entry span.val { color: var(--text); font-weight: 500; }

  /* Complete button */
  .complete-btn { width: 100%; margin-top: 1.25rem; padding: 14px; background: none; border: 1px solid var(--teal); border-radius: 12px; color: var(--teal); font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 500; cursor: pointer; letter-spacing: 0.08em; text-transform: uppercase; transition: all 0.2s; }
  .complete-btn:active { background: rgba(45,212,191,0.1); }

  .tip-box { margin-top: 1.25rem; background: var(--surface); border-left: 3px solid var(--teal); border-radius: 0 10px 10px 0; padding: 0.75rem 1rem; font-size: 0.82rem; color: #aaa; line-height: 1.55; }
  .tip-label { font-family: 'DM Mono', monospace; font-size: 0.65rem; color: var(--teal); letter-spacing: 0.08em; text-transform: uppercase; margin-bottom: 4px; }

  .rest-screen { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 3rem 1rem; text-align: center; gap: 0.75rem; }
  .rest-icon { font-size: 2.5rem; opacity: 0.3; }
  .rest-title { font-size: 1.2rem; font-weight: 700; }
  .rest-sub { font-size: 0.82rem; color: var(--muted); line-height: 1.5; max-width: 260px; }

  /* Completion overlay */
  .overlay { display: none; position: fixed; inset: 0; z-index: 100; background: rgba(0,0,0,0.92); overflow-y: auto; }
  .overlay.show { display: flex; flex-direction: column; align-items: center; justify-content: flex-start; padding: 2rem 1rem; }
  .overlay-card { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 1.5rem; width: 100%; max-width: 400px; margin-top: 1rem; }
  .overlay-title { font-size: 1.6rem; font-weight: 700; text-align: center; margin-bottom: 0.25rem; }
  .overlay-sub { font-size: 0.82rem; color: var(--muted); text-align: center; font-family: 'DM Mono', monospace; margin-bottom: 1.25rem; }
  .summary-item { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--border); font-size: 0.85rem; }
  .summary-item:last-child { border-bottom: none; }
  .summary-name { color: #aaa; }
  .summary-val { font-family: 'DM Mono', monospace; font-size: 0.8rem; color: var(--text); }
  .summary-diff { font-size: 0.65rem; padding: 1px 6px; border-radius: 4px; font-family: 'DM Mono', monospace; margin-left: 6px; }
  .diff-easy { background: rgba(74,222,128,0.15); color: var(--green); }
  .diff-medium { background: rgba(251,146,60,0.15); color: var(--coral); }
  .diff-hard { background: rgba(255,68,68,0.15); color: var(--yt); }
  .overlay-close { margin-top: 1rem; width: 100%; max-width: 400px; padding: 12px; background: var(--teal); color: #000; border: none; border-radius: 12px; font-family: 'DM Mono', monospace; font-size: 0.85rem; font-weight: 500; cursor: pointer; }

  /* Confetti canvas */
  #confetti-canvas { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 101; }
</style>
</head>
<body>

<canvas id="confetti-canvas"></canvas>

<header>
  <h1>My Gym Plan</h1>
  <p id="header-sub">Week 1 · Beginner · 4–5 days/week</p>
</header>

<div class="day-nav" id="dayNav"></div>
<div class="content" id="content"></div>

<div class="overlay" id="overlay">
  <div style="font-size:3rem;text-align:center;">🏋️</div>
  <div class="overlay-title">Workout done!</div>
  <div class="overlay-sub" id="overlay-date"></div>
  <div class="overlay-card">
    <div class="tip-label" style="margin-bottom:10px;">What you lifted</div>
    <div id="overlay-summary"></div>
  </div>
  <button class="overlay-close" onclick="closeOverlay()">Back to plan</button>
</div>

<script>
// ---- DATA ----
const days = [
  {
    label:"Mon", title:"Upper body — push", badge:"Strength", badgeClass:"badge-strength",
    focus:"Chest · Shoulders · Triceps",
    tip:"Rest 90s between sets. Focus on feeling the muscle, not just moving the weight.",
    exercises:[
      {id:"chest_press", name:"Chest press machine", sets:"3", reps:"10–12", kg:"20–25 kg", note:"Slow on the way back", yt:"https://www.youtube.com/watch?v=sqNwDkUU_Ps"},
      {id:"shoulder_press", name:"Shoulder press machine", sets:"3", reps:"10–12", kg:"10–15 kg", note:"Don't lock elbows at the top", yt:"https://www.youtube.com/watch?v=TnhIyp4kmO8"},
      {id:"cable_fly", name:"Cable chest fly", sets:"3", reps:"12–15", kg:"5–7.5 kg / side", note:"Wide arc, keep chest up", yt:"https://www.youtube.com/watch?v=ETtXO4FW1EU"},
      {id:"tricep_push", name:"Tricep pushdown (cable)", sets:"3", reps:"12–15", kg:"10–12.5 kg", note:"Elbows stay tucked in", yt:"https://www.youtube.com/watch?v=_w-HpW70nSQ"},
      {id:"treadmill_mon", name:"Treadmill", sets:"1", reps:"10 min", kg:"—", note:"Brisk walk to finish", yt:null},
    ]
  },
  {
    label:"Tue", title:"Lower body + core", badge:"Strength", badgeClass:"badge-strength",
    focus:"Quads · Hamstrings · Glutes · Abs",
    tip:"Legs drive the most calorie burn. This session does the most to shift belly fat.",
    exercises:[
      {id:"leg_press", name:"Leg press machine", sets:"3", reps:"10–12", kg:"40–50 kg", note:"Feet shoulder-width, don't lock knees", yt:"https://www.youtube.com/watch?v=p5dCqF7wWUw"},
      {id:"leg_ext", name:"Leg extension machine", sets:"3", reps:"12–15", kg:"20–25 kg", note:"Controlled — slow on the way down", yt:"https://www.youtube.com/watch?v=YyvSfVjQeL0"},
      {id:"leg_curl", name:"Leg curl machine", sets:"3", reps:"12–15", kg:"15–20 kg", note:"Full range of motion", yt:"https://www.youtube.com/watch?v=1Tq3QdYUuHs"},
      {id:"hip_abduct", name:"Hip abductor machine", sets:"3", reps:"15", kg:"20–30 kg", note:"Sit upright — don't lean forward", yt:"https://www.youtube.com/watch?v=OjI5OpV6IWA"},
      {id:"ab_crunch", name:"Ab crunch machine", sets:"3", reps:"15–20", kg:"10–15 kg", note:"Breathe out on the crunch", yt:"https://www.youtube.com/watch?v=3qjoXDTuyOE"},
      {id:"plank", name:"Plank", sets:"3", reps:"20–30 sec", kg:"—", note:"Build up time over weeks", yt:null},
    ]
  },
  {
    label:"Wed", title:"Cardio + recovery", badge:"Cardio", badgeClass:"badge-cardio",
    focus:"Stamina focus · Active recovery",
    tip:"Keep heart rate ~130–150 bpm. You should be able to hold a short conversation.",
    exercises:[
      {id:"incline_walk", name:"Treadmill incline walk", sets:"1", reps:"20 min", kg:"—", note:"Incline 4–6, speed 5–6 km/h", yt:null},
      {id:"bike", name:"Stationary bike", sets:"1", reps:"15 min", kg:"—", note:"Moderate resistance", yt:null},
      {id:"row_machine", name:"Rowing machine", sets:"1", reps:"10 min", kg:"—", note:"Full body — great for stamina", yt:"https://www.youtube.com/watch?v=H0r_D6jEI6k"},
      {id:"stretch_wed", name:"Stretching", sets:"1", reps:"10 min", kg:"—", note:"Hip flexors, hamstrings, chest", yt:null},
    ]
  },
  {
    label:"Thu", title:"Upper body — pull", badge:"Strength", badgeClass:"badge-strength",
    focus:"Back · Biceps",
    tip:"Pull movements build the back taper that makes you look muscular even in a t-shirt.",
    exercises:[
      {id:"lat_pull", name:"Lat pulldown machine", sets:"3", reps:"10–12", kg:"25–30 kg", note:"Pull to upper chest, don't swing", yt:"https://www.youtube.com/watch?v=6MLs17iyK9I"},
      {id:"cable_row", name:"Seated cable row", sets:"3", reps:"10–12", kg:"20–25 kg", note:"Squeeze shoulder blades together", yt:"https://www.youtube.com/watch?v=vwHG9Jfu4sw"},
      {id:"pullup", name:"Assisted pull-up machine", sets:"3", reps:"8–10", kg:"~40–50 kg counterweight", note:"Lower slowly — the drop is where gains happen", yt:"https://www.youtube.com/watch?v=lGCl8kVa6-c"},
      {id:"bicep_curl", name:"Bicep curl machine", sets:"3", reps:"12–15", kg:"10–15 kg", note:"Full range, no swinging", yt:null},
      {id:"face_pulls", name:"Face pulls (cable)", sets:"3", reps:"15", kg:"7.5–10 kg", note:"Elbows high — great for posture", yt:"https://www.youtube.com/watch?v=0Po47vvj9g4"},
    ]
  },
  {
    label:"Fri", title:"Full body + burn", badge:"Full body", badgeClass:"badge-full",
    focus:"Compound moves · Core",
    tip:"End of the week — push a little. Compound moves spike calorie burn into the weekend.",
    exercises:[
      {id:"smith_squat", name:"Smith machine squat", sets:"3", reps:"10–12", kg:"20–30 kg (bar only to start)", note:"Go to parallel or below", yt:"https://www.youtube.com/watch?v=yoP29LtTdnQ"},
      {id:"chest_press_fri", name:"Chest press machine", sets:"3", reps:"10–12", kg:"Same as Monday", note:"", yt:"https://www.youtube.com/watch?v=sqNwDkUU_Ps"},
      {id:"lat_pull_fri", name:"Lat pulldown", sets:"3", reps:"10–12", kg:"Same as Thursday", note:"", yt:"https://www.youtube.com/watch?v=6MLs17iyK9I"},
      {id:"cable_crunch", name:"Cable crunch", sets:"3", reps:"15–20", kg:"10–15 kg", note:"Hips stay locked — abs do the work", yt:"https://www.youtube.com/watch?v=AV5PmZJIrrw"},
      {id:"sprint_int", name:"Sprint intervals (treadmill)", sets:"1", reps:"12 min", kg:"—", note:"1 min fast / 1 min walk × 6", yt:null},
    ]
  },
  {
    label:"Sat", title:"Optional cardio", badge:"Cardio", badgeClass:"badge-cardio",
    focus:"Active rest · Your choice",
    tip:"Listen to your body this first month. Even a 30-min walk counts. Don't skip rest if sore.",
    exercises:[
      {id:"sat_cardio", name:"Treadmill / bike / swim", sets:"1", reps:"20–30 min", kg:"—", note:"Low intensity — stay moving", yt:null},
      {id:"stretch_sat", name:"Stretching", sets:"1", reps:"10 min", kg:"—", note:"", yt:null},
    ]
  },
  { label:"Sun", title:"Rest day", badge:"Rest", badgeClass:"badge-rest", focus:"Recovery", tip:"", rest:true }
];

// ---- STORAGE HELPERS ----
function getLog() { try { return JSON.parse(localStorage.getItem('gymLog') || '{}'); } catch(e) { return {}; } }
function saveLog(log) { localStorage.setItem('gymLog', JSON.stringify(log)); }
function getCompletedDays() { try { return JSON.parse(localStorage.getItem('completedDays') || '{}'); } catch(e) { return {}; } }
function saveCompletedDays(d) { localStorage.setItem('completedDays', JSON.stringify(d)); }

// Returns today as YYYY-MM-DD
function today() { return new Date().toISOString().slice(0,10); }

// Returns a key for this week's day e.g. "Mon_2025-W20"
function weekKey(label) {
  const d = new Date();
  const jan1 = new Date(d.getFullYear(), 0, 1);
  const week = Math.ceil(((d - jan1) / 86400000 + jan1.getDay() + 1) / 7);
  return `${label}_${d.getFullYear()}-W${week}`;
}

// Check if exercise was logged >= 3 times with "easy" recently (progression trigger)
function shouldSuggestProgression(exId) {
  const log = getLog();
  const entries = log[exId] || [];
  if (entries.length < 3) return false;
  const recent = entries.slice(-3);
  return recent.every(e => e.difficulty === 'easy');
}

// ---- STATE ----
let active = 0;
let openPanels = {};
let selectedDiff = {};
let sessionLogs = {}; // temp logs for current session before save

// ---- BUILD NAV ----
const nav = document.getElementById('dayNav');
const content = document.getElementById('content');

days.forEach((d, i) => {
  const btn = document.createElement('button');
  btn.className = 'day-btn' + (i === 0 ? ' active' : '');
  btn.id = `daybtn-${i}`;
  btn.textContent = d.label;
  const completed = getCompletedDays();
  if (completed[weekKey(d.label)]) {
    const dot = document.createElement('span');
    dot.className = 'done-dot';
    btn.appendChild(dot);
  }
  btn.onclick = () => {
    active = i;
    nav.querySelectorAll('.day-btn').forEach((b,j) => {
      b.className = 'day-btn' + (j===i?' active':'');
      const completed = getCompletedDays();
      if (completed[weekKey(days[j].label)]) {
        if (!b.querySelector('.done-dot')) {
          const dot = document.createElement('span'); dot.className='done-dot'; b.appendChild(dot);
        }
      }
    });
    openPanels = {}; selectedDiff = {};
    render();
  };
  nav.appendChild(btn);
});

// ---- RENDER ----
function render() {
  const d = days[active];
  if (d.rest) {
    content.innerHTML = `<div class="rest-screen"><div class="rest-icon">💤</div><div class="rest-title">Rest day</div><div class="rest-sub">Muscles grow during recovery, not just training.<br>Sleep well, eat protein, come back stronger.</div></div>`;
    return;
  }

  const log = getLog();
  const allExIds = d.exercises.map(e => e.id);
  const completedToday = allExIds.filter(id => {
    const entries = log[id] || [];
    return entries.length > 0 && entries[entries.length-1].date === today();
  });
  const isWorkoutDone = completedToday.length === allExIds.length;

  let html = `
    <div class="day-meta">
      <div class="badge ${d.badgeClass}">${d.badge.toUpperCase()}</div>
      <div class="day-title">${d.title}</div>
      <div class="day-focus">${d.focus}</div>
    </div>
    <div class="exercise-list">`;

  d.exercises.forEach(e => {
    const entries = log[e.id] || [];
    const lastEntry = entries.length > 0 ? entries[entries.length-1] : null;
    const doneToday = lastEntry && lastEntry.date === today();
    const showProg = shouldSuggestProgression(e.id);
    const isOpen = openPanels[e.id];
    const selDiff = selectedDiff[e.id] || '';

    html += `<div class="exercise-card ${doneToday ? 'completed' : ''}" id="card-${e.id}">
      <div class="ex-header">
        <div class="ex-left">
          <div class="ex-name-row">
            <div class="ex-name">${doneToday ? '✓ ' : ''}${e.name}</div>
            ${e.yt ? `<a class="yt-link" href="${e.yt}" target="_blank">▶ tutorial</a>` : ''}
          </div>
          <div class="ex-pills">
            <span class="pill">${e.sets} sets</span>
            <span class="pill">${e.reps} reps</span>
            ${e.kg === '—' ? `<span class="pill">no weight</span>` : ''}
          </div>
          ${e.note ? `<div class="ex-note">${e.note}</div>` : ''}
          ${showProg ? `<div class="prog-reminder">🔥 Time to increase weight!</div>` : ''}
        </div>
        ${e.kg !== '—' ? `<div class="ex-weight">${e.kg}</div>` : ''}
      </div>`;

    // Log toggle
    html += `<button class="log-toggle ${isOpen ? 'open' : ''}" onclick="togglePanel('${e.id}')">
      <span>${doneToday ? '✓ Logged today' : 'Log this exercise'}</span>
      <span>${isOpen ? '▲' : '▼'}</span>
    </button>`;

    // Log panel
    html += `<div class="log-panel ${isOpen ? 'open' : ''}" id="panel-${e.id}">`;

    // Previous log
    if (lastEntry) {
      html += `<div class="prev-log">
        <div class="prev-log-title">Last logged — ${lastEntry.date}</div>
        <div class="prev-log-entry">
          ${lastEntry.weight ? `<span class="val">${lastEntry.weight}kg</span> · ` : ''}
          <span class="val">${lastEntry.reps} reps</span> ·
          <span class="val">${lastEntry.difficulty}</span>
        </div>
      </div>`;
    }

    if (e.kg !== '—') {
      html += `<div class="log-row" style="margin-top:10px;">
        <div class="log-input-wrap">
          <div class="log-label">Weight (kg)</div>
          <input class="log-input" type="number" id="w-${e.id}" placeholder="${lastEntry ? lastEntry.weight : '0'}" inputmode="decimal">
        </div>
        <div class="log-input-wrap">
          <div class="log-label">Reps done</div>
          <input class="log-input" type="number" id="r-${e.id}" placeholder="${lastEntry ? lastEntry.reps : '0'}" inputmode="numeric">
        </div>
      </div>`;
    } else {
      html += `<div style="margin-top:10px;">
        <div class="log-input-wrap">
          <div class="log-label">Duration / reps done</div>
          <input class="log-input" type="text" id="r-${e.id}" placeholder="${lastEntry ? lastEntry.reps : e.reps}">
        </div>
      </div>`;
    }

    html += `<div style="margin-top:8px;margin-bottom:2px;"><div class="log-label">How did it feel?</div></div>
    <div class="difficulty-row">
      <button class="diff-btn easy ${selDiff==='easy'?'selected':''}" onclick="selectDiff('${e.id}','easy')">Easy</button>
      <button class="diff-btn medium ${selDiff==='medium'?'selected':''}" onclick="selectDiff('${e.id}','medium')">Medium</button>
      <button class="diff-btn hard ${selDiff==='hard'?'selected':''}" onclick="selectDiff('${e.id}','hard')">Hard</button>
    </div>
    <button class="log-save-btn" onclick="saveEntry('${e.id}')">Save log</button>
    </div>`; // close log-panel

    html += `</div>`; // close exercise-card
  });

  html += `</div>`; // close exercise-list

  if (!isWorkoutDone) {
    html += `<button class="complete-btn" onclick="completeWorkout()">Mark workout complete</button>`;
  } else {
    html += `<div style="text-align:center;margin-top:1.25rem;font-family:'DM Mono',monospace;font-size:0.8rem;color:var(--teal);">✓ Workout completed today</div>`;
  }

  if (d.tip) {
    html += `<div class="tip-box"><div class="tip-label">Coach tip</div>${d.tip}</div>`;
  }

  content.innerHTML = html;
}

// ---- INTERACTIONS ----
function togglePanel(exId) {
  openPanels[exId] = !openPanels[exId];
  render();
  // scroll to panel
  setTimeout(() => {
    const el = document.getElementById(`panel-${exId}`);
    if (el) el.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
  }, 50);
}

function selectDiff(exId, diff) {
  selectedDiff[exId] = diff;
  render();
  openPanels[exId] = true;
}

function saveEntry(exId) {
  const wEl = document.getElementById(`w-${exId}`);
  const rEl = document.getElementById(`r-${exId}`);
  const diff = selectedDiff[exId];

  if (!rEl.value) { rEl.style.borderColor = 'var(--yt)'; return; }
  if (!diff) { alert('Please select how it felt (Easy / Medium / Hard)'); return; }

  const log = getLog();
  if (!log[exId]) log[exId] = [];
  log[exId].push({
    date: today(),
    weight: wEl ? wEl.value : null,
    reps: rEl.value,
    difficulty: diff
  });
  saveLog(log);
  openPanels[exId] = false;
  render();
}

function completeWorkout() {
  const d = days[active];
  const log = getLog();

  // Build summary
  const summaryItems = d.exercises.map(e => {
    const entries = log[e.id] || [];
    const last = entries.length > 0 ? entries[entries.length-1] : null;
    return { name: e.name, entry: last };
  });

  const summaryHtml = summaryItems.map(s => {
    if (!s.entry) return `<div class="summary-item"><span class="summary-name">${s.name}</span><span class="summary-val" style="color:var(--muted)">not logged</span></div>`;
    const diffClass = s.entry.difficulty ? `diff-${s.entry.difficulty}` : '';
    return `<div class="summary-item">
      <span class="summary-name">${s.name}</span>
      <span class="summary-val">
        ${s.entry.weight ? s.entry.weight+'kg · ' : ''}${s.entry.reps} reps
        ${s.entry.difficulty ? `<span class="summary-diff ${diffClass}">${s.entry.difficulty}</span>` : ''}
      </span>
    </div>`;
  }).join('');

  document.getElementById('overlay-summary').innerHTML = summaryHtml;
  document.getElementById('overlay-date').textContent = new Date().toLocaleDateString('en-GB', {weekday:'long', day:'numeric', month:'long'});
  document.getElementById('overlay').classList.add('show');

  // Mark as completed
  const completed = getCompletedDays();
  completed[weekKey(d.label)] = today();
  saveCompletedDays(completed);

  // Update nav dot
  const btn = document.getElementById(`daybtn-${active}`);
  if (btn && !btn.querySelector('.done-dot')) {
    const dot = document.createElement('span'); dot.className = 'done-dot'; btn.appendChild(dot);
  }

  // Confetti
  launchConfetti();
}

function closeOverlay() {
  document.getElementById('overlay').classList.remove('show');
  stopConfetti();
  render();
}

// ---- CONFETTI ----
let confettiAnim = null;
const canvas = document.getElementById('confetti-canvas');
const ctx = canvas.getContext('2d');
let particles = [];

function launchConfetti() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  particles = [];
  const colors = ['#2dd4bf','#a78bfa','#fb923c','#60a5fa','#4ade80','#f0f0f0'];
  for (let i = 0; i < 120; i++) {
    particles.push({
      x: Math.random() * canvas.width,
      y: Math.random() * -canvas.height * 0.5,
      w: Math.random() * 10 + 5,
      h: Math.random() * 5 + 3,
      color: colors[Math.floor(Math.random() * colors.length)],
      rot: Math.random() * 360,
      vx: (Math.random() - 0.5) * 3,
      vy: Math.random() * 4 + 2,
      vr: (Math.random() - 0.5) * 5
    });
  }
  animateConfetti();
}

function animateConfetti() {
  ctx.clearRect(0, 0, canvas.width, canvas.height);
  let alive = false;
  particles.forEach(p => {
    p.x += p.vx; p.y += p.vy; p.rot += p.vr; p.vy += 0.05;
    if (p.y < canvas.height + 20) alive = true;
    ctx.save();
    ctx.translate(p.x, p.y);
    ctx.rotate(p.rot * Math.PI / 180);
    ctx.fillStyle = p.color;
    ctx.fillRect(-p.w/2, -p.h/2, p.w, p.h);
    ctx.restore();
  });
  if (alive) confettiAnim = requestAnimationFrame(animateConfetti);
}

function stopConfetti() {
  if (confettiAnim) cancelAnimationFrame(confettiAnim);
  ctx.clearRect(0, 0, canvas.width, canvas.height);
}

// ---- INIT ----
render();
</script>
